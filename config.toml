# example configuration

# configure release bind
release_bind = [ "KeyA", "KeyS", "KeyD", "KeyF" ]

# optional port (defaults to 4242)
port = 4242

# replace keys in input from devices grabbed in stand-in mode, which bypasses
# the compositor's key remapping (here XKB's ctrl:nocaps)
grab_key_map = { KeyCapsLock = "KeyLeftCtrl" }

# Run local commands around captured key forwarding. The press command must
# finish before key-down is forwarded; key-up is forwarded before release runs.
# Hook failures and timeouts do not prevent forwarding.
[[key_hooks]]
key = "KeyF13"
press = "notify-send 'captured key pressed'"
release = "notify-send 'captured key released'"
timeout_ms = 1000

# list of authorized tls certificate fingerprints that
# are accepted for incoming traffic
[authorized_fingerprints]
"bc:05:ab:7a:a4:de:88:8c:2f:92:ac:bc:b8:49:b8:24:0d:44:b3:e6:a4:ef:d7:0b:6c:69:6d:77:53:0b:14:80" = "iridium"

# define a client on the right side with host name "iridium"
[[clients]]
# position (left | right | top | bottom)
position = "right"
# hostname
hostname = "iridium"
# activate this client immediately when lan-mouse is started
activate_on_startup = true
# optional list of (known) ip addresses
ips = ["192.168.178.156"]

# define a client on the left side with IP address 192.168.178.189
[[clients]]
position = "left"
# The hostname is optional: When no hostname is specified,
# at least one ip address needs to be specified.
hostname = "thorium"
# ips for ethernet and wifi
ips = ["192.168.178.189", "192.168.178.172"]
# optional port
port = 4242
# optional shell command run via `sh -c` when the cursor enters this client
enter_hook = "notify-send 'entered thorium'"
# optional shell command run via `sh -c` when capture for this client is
# released (release_bind chord, peer Leave, or `cli deactivate`)
leave_hook = "notify-send 'left thorium'"

# optional client that replaces this device's screen while stand-in mode is on
# (`lan-mouse cli stand-in on`), e.g. after a KVM switches a shared monitor to
# it. Leave it inactive when it has no screen of its own next to this device.
[[clients]]
position = "right"
hostname = "cobalt"
stand_in = true
